<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin sign in — Chillar Angadi</title>
    <link rel="icon" type="image/png" href="/images/logo-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f6f1e4; --cream-2: #efe7d3; --paper: #fffdf7; --ink: #1e2a1a; --ink-soft: #5b6552;
            --olive: #7c9a2c; --olive-deep: #4f6b16; --carrot: #f08a24; --apple: #d8402b;
            --line: rgba(30, 42, 26, .12); --ease: cubic-bezier(.22, 1, .36, 1);
            --display: 'Fraunces', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; font-family: var(--sans); color: var(--cream); background: var(--ink);
            display: grid; grid-template-columns: 1.1fr 1fr; -webkit-font-smoothing: antialiased;
        }
        button, input { font: inherit; color: inherit; }
        .side {
            position: relative; overflow: hidden; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
            background: radial-gradient(120% 90% at 0% 100%, rgba(124, 154, 44, .55), transparent 60%),
                        radial-gradient(80% 70% at 100% 0%, rgba(240, 138, 36, .35), transparent 60%), var(--ink);
        }
        .side .brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 1.3rem; font-weight: 700; }
        .side .brand img { width: 46px; height: 46px; border-radius: 50%; background: var(--cream); }
        .side h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.8rem, 5.5vw, 5.4rem); line-height: .95; letter-spacing: -.035em; }
        .side h1 em { color: var(--carrot); font-weight: 400; }
        .side p { color: rgba(246, 241, 228, .65); max-width: 38ch; margin-top: 18px; }
        .rings { position: absolute; right: -140px; top: 50%; translate: 0 -50%; width: 520px; height: 520px; pointer-events: none; }
        .rings span { position: absolute; inset: 0; border: 1px solid rgba(246, 241, 228, .14); border-radius: 50%; animation: pulse 6s var(--ease) infinite; }
        .rings span:nth-child(2) { inset: 60px; animation-delay: 1s; }
        .rings span:nth-child(3) { inset: 120px; animation-delay: 2s; }
        @keyframes pulse { 50% { transform: scale(1.06); opacity: .4; } }
        .foot { font-size: .82rem; color: rgba(246, 241, 228, .45); }
        main { background: var(--cream); color: var(--ink); display: grid; place-items: center; padding: 40px 24px; border-radius: 32px 0 0 32px; }
        .card { width: min(400px, 100%); animation: in .9s var(--ease) both; }
        @keyframes in { from { opacity: 0; transform: translateY(24px); } }
        .tag { display: inline-flex; align-items: center; gap: 8px; font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--olive-deep); }
        .tag::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--olive); box-shadow: 0 0 0 4px rgba(124, 154, 44, .2); }
        h2 { font-family: var(--display); font-size: 2.6rem; font-weight: 600; letter-spacing: -.03em; margin: 12px 0 6px; }
        .sub { color: var(--ink-soft); margin-bottom: 28px; }
        form { display: grid; gap: 14px; }
        .field { position: relative; }
        .field input {
            width: 100%; padding: 24px 16px 9px; border-radius: 14px; border: 1.5px solid var(--line);
            background: var(--paper); outline: none; transition: border-color .3s, box-shadow .3s;
        }
        .field input:focus { border-color: var(--olive); box-shadow: 0 0 0 4px rgba(124, 154, 44, .15); }
        .field label { position: absolute; left: 17px; top: 16px; color: var(--ink-soft); font-weight: 600; pointer-events: none; transform-origin: left top; transition: transform .3s var(--ease), color .3s; }
        .field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-9px) scale(.74); color: var(--olive-deep); }
        .reveal-pw { position: absolute; right: 12px; top: 50%; translate: 0 -50%; background: none; border: 0; font-size: .8rem; font-weight: 700; color: var(--ink-soft); cursor: pointer; padding: 6px; }
        .error { display: none; padding: 12px 14px; border-radius: 14px; background: rgba(216, 64, 43, .1); color: var(--apple); font-weight: 600; font-size: .9rem; }
        .error.show { display: block; animation: shake .4s; }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .btn {
            margin-top: 6px; padding: 16px; border-radius: 999px; border: 0; cursor: pointer; font-weight: 800;
            background: var(--ink); color: var(--cream); display: flex; justify-content: center; align-items: center; gap: 10px;
            position: relative; overflow: hidden; isolation: isolate; transition: transform .3s var(--ease);
        }
        .btn::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--olive); transform: translateY(101%); transition: transform .5s var(--ease); }
        .btn:hover::before { transform: none; }
        .btn[disabled] { opacity: .6; pointer-events: none; }
        .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: currentColor; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back { display: inline-block; margin-top: 26px; font-weight: 700; font-size: .88rem; color: var(--ink-soft); text-decoration: none; }
        .back:hover { color: var(--ink); }
        :focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; }
        @media (max-width: 860px) {
            body { grid-template-columns: 1fr; }
            .side { padding: 28px 24px 70px; min-height: 260px; }
            .side h1 { font-size: 2.6rem; margin-top: 30px; }
            .side p, .foot, .rings { display: none; }
            main { border-radius: 28px 28px 0 0; margin-top: -40px; align-items: start; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <aside class="side">
        <div class="brand"><img src="/images/logo-mark.png" alt="">Chillar Angadi</div>
        <div>
            <h1>Back of<br>the <em>shop.</em></h1>
            <p>Stock, orders and shelf prices. Staff only — shoppers never see this page.</p>
        </div>
        <div class="foot">Sessions expire after 7 days of inactivity.</div>
        <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
    </aside>
    <main>
        <div class="card">
            <span class="tag">Admin console</span>
            <h2>Sign in</h2>
            <p class="sub" id="sub">Use your admin username or email.</p>
            <form id="form" novalidate>
                <div class="field"><input id="username" autocomplete="username" placeholder=" " required><label for="username">Username or email</label></div>
                <div class="field">
                    <input id="password" type="password" autocomplete="current-password" placeholder=" " required><label for="password">Password</label>
                    <button type="button" class="reveal-pw" id="reveal" aria-label="Show password">Show</button>
                </div>
                <div class="error" id="error" role="alert"></div>
                <button class="btn" id="submit" type="submit">Sign in →</button>
            </form>
            <a class="back" href="/store.html">← Back to the store</a>
        </div>
    </main>

    <script>
    (() => {
        const params = new URLSearchParams(location.search);
        // Only follow same-site admin paths after sign-in
        const next = (params.get('next') || '').startsWith('/admin/') && !params.get('next').startsWith('/admin/login')
            ? params.get('next') : '/admin/index.html';
        const $ = id => document.getElementById(id);
        const showError = msg => { $('error').textContent = msg; $('error').classList.remove('show'); void $('error').offsetWidth; $('error').classList.add('show'); };

        if (params.has('denied')) showError('That account is not an admin. Sign in with an admin account.');

        // Already signed in as admin? Skip the form.
        fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(me => {
            if (me && me.role === 'ROLE_ADMIN') location.replace(next);
        }).catch(() => {});

        $('reveal').addEventListener('click', () => {
            const show = $('password').type === 'password';
            $('password').type = show ? 'text' : 'password';
            $('reveal').textContent = show ? 'Hide' : 'Show';
            $('reveal').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });

        $('form').addEventListener('submit', async e => {
            e.preventDefault();
            const username = $('username').value.trim();
            const password = $('password').value;
            if (!username || !password) { showError('Enter your username and password.'); return; }
            $('submit').disabled = true;
            $('submit').innerHTML = '<span class="spinner"></span> Signing in…';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, admin: true })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'Sign in failed');
                location.replace(next);
            } catch (err) {
                showError(err.message);
                $('password').select();
                $('submit').disabled = false;
                $('submit').textContent = 'Sign in →';
            }
        });
    })();
    </script>
</body>
</html>
